# Podman-compatible variant of docker-compose.yaml.
# podman compose -f docker-compose.podman.yaml up -d

networks:
  sia-net:
    name: sia-net

services:
  sia-core-api:
    build:
      context: ./sia-core-api
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    image: sia-core-api:latest
    container_name: sia-core-api
    ports:
      - 10083:10083
    environment:
      #NVIDIA_DRIVER_CAPABILITIES: compute,utility # needed in Lt2
      SOLR_URL: http://solr:8983
      SIA_MASTER_KEY: ${SIA_MASTER_KEY:-master-key-change-in-production}
      API_KEYS_FILE: /config/api_keys.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - solr
    volumes:
      - ./data/:/mnt/data:Z
      - ./sia-config:/config:Z
      - ./db/data/sqlite3/pipeline_jobs.db:/data/pipeline_jobs.db:Z
    deploy:
      resources:
        limits:
          memory: 100GB
        # remove the following for Lt2
        #reservations:
        #  devices:
        #    - driver: nvidia
        #      device_ids: ["2"]
        #      capabilities: [gpu]
        # NOTE: if you re-enable GPU access under Podman, the docker
        # `driver: nvidia` reservation syntax above does not apply - Podman
        # uses CDI instead, e.g.:
        #   devices:
        #     - nvidia.com/gpu=all

  solr:
    build:
      context: ./solr-plugins/NP-solr-dist-plugin
    image: sia-solr:9.1.1
    container_name: sia-solr
    restart: always
    volumes:
      - ./db/data/solr:/var/solr:Z
      - ./solr-config:/opt/solr/server/solr:Z
      - ./solr-config/solr.in.sh:/etc/default/solr.in.sh:Z
    ports:
      - 10085:8983
    entrypoint:
      - docker-entrypoint.sh
      - solr
      - start
      - -f
      - -c
      - -z
      - zoo:2181
      - -a
      - "-Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=1044 -Djute.maxbuffer=0x5000000"
    environment:
      - SOLR_OPTS=-Dsolr.jetty.request.header.size=65535
      - SOLR_JAVA_MEM=-Xms1g -Xmx1g
    #networks:
    #  - np-net
    deploy:
      resources:
        limits:
          memory: 100GB

  solr-config:
    build: ./solr-config
    image: sia-solr-config:latest
    container_name: sia-solr-config
    ports:
      - 10088:81
    depends_on:
      - solr
      - zoo
    #networks:
    #  - np-net
    volumes:
      - ${PODMAN_SOCK:-/run/podman/podman.sock}:/var/run/docker.sock
      - ./solr-config/bash_scripts:/bash_scripts:Z
      - ./db/data/solr:/db/data/solr:Z
    command:
      - sh
      - -c
      - "chmod +x /bash_scripts/init_config.sh && ls /bash_scripts && bash_scripts/init_config.sh /db/data/solr/data"
    deploy:
      resources:
        limits:
          memory: 100GB

  solr-initializer:
    image: docker.io/library/alpine
    container_name: sia-solr-initializer
    restart: "no"
    entrypoint: |
      /bin/sh -c "chown 8983:8983 /solr"
    #networks:
    #  - np-net
    volumes:
      - ./db/data/solr:/solr:Z

  zoo:
    image: docker.io/library/zookeeper
    container_name: sia-zoo
    restart: always
    ports:
      - 10086:8080
      - 10087:2181
    environment:
      - JVMFLAGS=-Djute.maxbuffer=50000000
    volumes:
      - ./db/data/zoo/data:/data:Z
      - ./db/data/zoo/logs:/datalog:Z
    #networks:
    #  - np-net
    deploy:
      resources:
        limits:
          memory: 100GB
