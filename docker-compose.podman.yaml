networks:
  sia-net:
    name: sia-net

services:
  sia-core-api:
    image: ${SIA_CORE_API_IMAGE:-sia-core-api:latest} # to use a precompiled image instead of building; comment out if build is going to be used.
    build:
      context: ./sia-core-api
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: sia-core-api
    ports:
      - 10083:10083
    environment:
      #NVIDIA_DRIVER_CAPABILITIES: compute,utility # needed in Lt2
      SOLR_URL: http://solr:8983
      SIA_MASTER_KEY: ${SIA_MASTER_KEY:-master-key-change-in-production}
      API_KEYS_FILE: /config/api_keys.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - solr
    networks:
      - sia-net
    volumes:
      - ${SIA_DATA_DIR:-./data}/:/mnt/data
      - ./sia-config:/config
      - ./db/data/sqlite3/pipeline_jobs.db:/data/pipeline_jobs.db
    deploy:
      resources:
        limits:
          memory: 100GB
        # GPU reservation, optional - remove/leave commented for Lt2 or machines without a GPU
        #reservations:
        #  devices:
        #    - driver: nvidia
        #      device_ids: ["2"]
        #      capabilities: [gpu]
        # NOTE: under Podman use CDI instead of the docker `driver: nvidia` syntax above:
        #   devices:
        #     - nvidia.com/gpu=all

  solr:
    image: ${SOLR_IMAGE:-sia-solr:9.1.1}  # to use a precompiled image instead of building; comment out if build is going to be used.
    build:
      context: ./solr-plugins/NP-solr-dist-plugin
    container_name: sia-solr
    restart: always
    volumes:
      - ${SOLR_DATA_DIR:-./db/data/solr}:/var/solr:Z,U
      - ./solr-config:/opt/solr/server/solr:Z,U
      - ./solr-config/solr.in.sh:/etc/default/solr.in.sh:Z,U
    ports:
      - 10085:8983
    entrypoint:
      - docker-entrypoint.sh
      - solr
      - start
      - -f
      - -c
      - -z
      - zoo:2181
      - -a
      - "-Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=1044 -Djute.maxbuffer=0x5000000"
    environment:
      - SOLR_OPTS=-Dsolr.jetty.request.header.size=65535
      - SOLR_JAVA_MEM=-Xms1g -Xmx1g
    networks:
      - sia-net
    deploy:
      resources:
        limits:
          memory: 100GB

  zoo:
    image: ${ZOOKEEPER_IMAGE:-docker.io/library/zookeeper}  # to use a precompiled image instead of building; comment out if build is going to be used.
    container_name: sia-zoo
    restart: always
    ports:
      - 10086:8080
      - 10087:2181
    environment:
      - JVMFLAGS=-Djute.maxbuffer=50000000
    volumes:
      - ./db/data/zoo/data:/data
      - ./db/data/zoo/logs:/datalog
    networks:
      - sia-net
    deploy:
      resources:
        limits:
          memory: 100GB
